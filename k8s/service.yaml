apiVersion: v1
kind: Service
metadata:
  name: booking-api
  namespace: argocd-demo
  labels:
    monitoring: booking-platform
spec:
  type: NodePort
  selector:
    app: booking-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081

---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: argocd-demo
  labels:
    monitoring: booking-platform
spec:
  type: ClusterIP
  selector:
    app: payment-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
